name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FBAuto-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FBAuto.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FBAuto.apk --title "FB Auto - bản mới nhất" --notes "Tải file FBAuto.apk bên dưới và cài lên điện thoại. Build từ commit ${{ github.sha }}."
